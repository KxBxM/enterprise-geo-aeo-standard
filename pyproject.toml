[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-geo-aeo-standard"
version = "0.1.0"
authors = [
  { name="James Stone", email="audit@jamesstone.dev" },
]
description = "Canonical CLI validator for enterprise Generative Engine Optimization (GEO) and /llms.txt machine endpoints."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

[project.urls]
"Homepage" = "https://jamesstone.dev"
"Documentation" = "https://jamesstone.dev/whitepaper.html"
"Repository" = "https://github.com/KxBxM/enterprise-geo-aeo-standard"

[project.scripts]
geo-validate = "validator:main"